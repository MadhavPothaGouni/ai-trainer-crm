# Serves the built SPA and proxies API calls to the backend container, mirroring
# the Vite dev-server proxy (vite.config.ts) so the frontend behaves identically
# in docker-compose and local dev: one origin, no CORS involved for the browser.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (react-router-dom): any path that isn't a real static
    # file falls back to index.html so a hard refresh on e.g. /reset-password
    # doesn't 404 against nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
