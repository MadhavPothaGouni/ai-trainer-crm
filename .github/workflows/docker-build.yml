name: Docker Build

# Validates that both Dockerfiles actually build - catches a broken Dockerfile
# or a build-stage failure (e.g. `npm run build` failing inside the frontend
# image, which uses a fresh `npm ci` rather than CI's cached node_modules)
# before it's only discovered at deploy time. Images are built, not pushed -
# there's no registry configured for this repo yet.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/crm-platform/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/crm-platform/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

jobs:
  build-backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend/crm-platform
          push: false
          tags: ai-trainer-crm/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend-image:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: ai-trainer-crm/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
