name: Release

# Publishes versioned container images and cuts a GitHub Release whenever a
# vX.Y.Z tag is pushed. Separate from docker-build.yml on purpose:
# docker-build.yml validates that both Dockerfiles still build on every PR/push
# (fast feedback, nothing published), while this workflow is the actual release
# path - it only runs when someone deliberately tags a version, and its output
# (published images + a GitHub Release) is what docker-compose.prod.yml pulls.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and push (e.g. v1.2.3) - for re-running a release without pushing a new tag"
        required: true

permissions:
  contents: write # to create the GitHub Release
  packages: write # to push to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      owner: ${{ steps.resolve.outputs.owner }}
    steps:
      - name: Resolve tag and lowercase image owner
        id: resolve
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # GHCR repository paths must be all-lowercase; a GitHub username/org
          # is allowed mixed case, so this can't just be used as-is.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

  build-and-push-backend:
    name: Build & push backend image
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/crm-platform
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.resolve-tag.outputs.owner }}/ai-trainer-crm-backend:${{ needs.resolve-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.resolve-tag.outputs.owner }}/ai-trainer-crm-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-and-push-frontend:
    name: Build & push frontend image
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.resolve-tag.outputs.owner }}/ai-trainer-crm-frontend:${{ needs.resolve-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.resolve-tag.outputs.owner }}/ai-trainer-crm-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  create-release:
    name: Create GitHub Release
    needs: [resolve-tag, build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    # workflow_dispatch re-runs against an existing tag shouldn't try to create
    # a second release for it - only a real tag push cuts a new release.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          generate_release_notes: true
          body: |
            Images published to GHCR for this release:

            - `ghcr.io/${{ needs.resolve-tag.outputs.owner }}/ai-trainer-crm-backend:${{ needs.resolve-tag.outputs.tag }}`
            - `ghcr.io/${{ needs.resolve-tag.outputs.owner }}/ai-trainer-crm-frontend:${{ needs.resolve-tag.outputs.tag }}`

            See [Deploying to production](../blob/main/README.md#deploying-to-production) in the README for how to roll this out with `docker-compose.prod.yml`.
