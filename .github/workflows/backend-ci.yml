name: Backend CI

# This is the actual verification for the crm-platform backend. It
# doesn't exist to satisfy a checklist - Maven Central is unreachable
# from the sandbox this codebase was originally written in, so this
# workflow is the first place `mvn test` (and therefore the
# AuthServiceTest/AuthControllerIntegrationTest suites) actually runs.
# GitHub-hosted ubuntu runners ship Docker preinstalled, which is what
# AbstractIntegrationTest's Testcontainers PostgreSQL container needs.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/crm-platform/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/crm-platform/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: backend/crm-platform

jobs:
  build-and-test:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: mvn -B -ntp compile

      - name: Run tests
        # Surefire's default include pattern (**/*Test.java) already
        # picks up AuthControllerIntegrationTest.java alongside the pure
        # unit tests - there's no separate failsafe/integration-test
        # phase configured, everything runs here under `test`.
        run: mvn -B -ntp verify

      - name: Publish surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/crm-platform/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/crm-platform/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14
