spring:
  application:
    name: crm-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_trainer_crm}
    username: ${DB_USERNAME:crm_user}
    password: ${DB_PASSWORD:crm_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never by Hibernate auto-DDL
    open-in-view: false # avoid the lazy-loading-in-the-view anti-pattern; fetch what a controller needs explicitly
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Backs attachment/'s upload endpoint. 25 MB request/25 MB file gives a little headroom
  # over AttachmentService.MAX_FILE_SIZE_BYTES (20 MB) for the surrounding multipart form
  # fields (relatedToType/relatedToId/description) - the parser rejecting an oversized part
  # (see GlobalExceptionHandler#handleMaxUploadSizeExceeded) is the actual enforcement point;
  # AttachmentService's own check is a second line of defense.
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

crm:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_this_must_be_at_least_256_bits_long}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    issuer: ai-trainer-crm

  security:
    max-failed-login-attempts: 5
    account-lockout-minutes: 15
    password-reset-token-expiration-minutes: 30
    email-verification-token-expiration-hours: 24

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  # Backs LocalFileStorageService - see its javadoc for why local disk is a documented
  # limitation, not a production plan. In the Docker Compose setup this should be a mounted
  # volume so uploads survive a container restart; a real production deployment should
  # implement FileStorageService against S3/GCS instead.
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}

  # Backs SlaEvaluationService#sweep, the platform's first real @Scheduled job. 5 minutes by
  # default - frequent enough that an escalation notification doesn't sit unsent for long after
  # a deadline passes, infrequent enough not to hammer the database scanning every open ticket
  # across every organization on a tight loop.
  sla:
    sweep-interval-ms: ${SLA_SWEEP_INTERVAL_MS:300000}

logging:
  level:
    root: INFO
    com.aitrainercrm: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
